<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理後台 | 賜建科技</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- 登入畫面 -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <h1>賜建科技</h1>
      <p class="login-sub">網站管理後台</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="password">管理密碼</label>
          <input type="password" id="password" placeholder="請輸入密碼" required autofocus>
        </div>
        <button type="submit" class="btn btn--primary btn--full">登入</button>
        <p class="login-hint">預設密碼：cijian2026</p>
      </form>
      <a href="index.html" class="back-link">← 返回網站</a>
    </div>
  </div>

  <!-- 管理面板 -->
  <div class="admin-panel" id="adminPanel" style="display:none">
    <aside class="sidebar">
      <div class="sidebar__brand">
        <h2>賜建科技</h2>
        <span>管理後台</span>
      </div>
      <nav class="sidebar__nav">
        <button class="sidebar__btn active" data-tab="theme">🎨 主題配色</button>
        <button class="sidebar__btn" data-tab="hero">🏠 首頁主視覺</button>
        <button class="sidebar__btn" data-tab="about">📋 關於我們</button>
        <button class="sidebar__btn" data-tab="products">💡 產品管理</button>
        <button class="sidebar__btn" data-tab="features">⭐ 產品特色</button>
        <button class="sidebar__btn" data-tab="comparison">📊 產品比較</button>
        <button class="sidebar__btn" data-tab="videos">🎬 影片管理</button>
        <button class="sidebar__btn" data-tab="gallery">🖼 案例圖片</button>
        <button class="sidebar__btn" data-tab="contact">📞 聯絡資訊</button>
        <button class="sidebar__btn" data-tab="settings">⚙️ 帳號設定</button>
      </nav>
      <div class="sidebar__footer">
        <a href="index.html" target="_blank" class="btn btn--outline btn--sm btn--full">預覽網站</a>
        <button class="btn btn--danger btn--sm btn--full" id="logoutBtn">登出</button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <h1 id="tabTitle">主題配色</h1>
        <div class="admin-header__actions">
          <button class="btn btn--outline btn--sm" id="importBtn">匯入 JSON</button>
          <button class="btn btn--outline btn--sm" id="exportBtn">匯出發布</button>
          <button class="btn btn--outline btn--sm" id="resetBtn">重置為預設</button>
          <button class="btn btn--primary btn--sm" id="saveBtn">儲存變更</button>
        </div>
        <input type="file" id="importFile" accept=".json" style="display:none">
      </header>

      <div class="admin-content">
        <!-- 主題配色 -->
        <section class="tab-panel active" id="tab-theme">
          <div class="card">
            <h3>網站配色</h3>
            <div class="color-grid">
              <div class="form-group">
                <label>主色調（金色）</label>
                <div class="color-input">
                  <input type="color" id="themeAccent" value="#c9a227">
                  <input type="text" id="themeAccentText" value="#c9a227">
                </div>
              </div>
              <div class="form-group">
                <label>淺金色</label>
                <div class="color-input">
                  <input type="color" id="themeAccentLight" value="#f0d78c">
                  <input type="text" id="themeAccentLightText" value="#f0d78c">
                </div>
              </div>
              <div class="form-group">
                <label>品牌綠色</label>
                <div class="color-input">
                  <input type="color" id="themeGreen" value="#1e4d35">
                  <input type="text" id="themeGreenText" value="#1e4d35">
                </div>
              </div>
              <div class="form-group">
                <label>背景色</label>
                <div class="color-input">
                  <input type="color" id="themeBg" value="#0a0f0d">
                  <input type="text" id="themeBgText" value="#0a0f0d">
                </div>
              </div>
              <div class="form-group">
                <label>次要背景</label>
                <div class="color-input">
                  <input type="color" id="themeBgAlt" value="#111916">
                  <input type="text" id="themeBgAltText" value="#111916">
                </div>
              </div>
              <div class="form-group">
                <label>文字顏色</label>
                <div class="color-input">
                  <input type="color" id="themeText" value="#e8ebe9">
                  <input type="text" id="themeTextText" value="#e8ebe9">
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- 首頁主視覺 -->
        <section class="tab-panel" id="tab-hero">
          <div class="card">
            <h3>主視覺文字</h3>
            <div class="form-group">
              <label>標籤文字</label>
              <input type="text" id="heroTag">
            </div>
            <div class="form-group">
              <label>主標題</label>
              <input type="text" id="heroTitle">
            </div>
            <div class="form-group">
              <label>副標題（高亮）</label>
              <input type="text" id="heroTitleHighlight">
            </div>
            <div class="form-group">
              <label>描述文字</label>
              <textarea id="heroDesc" rows="3"></textarea>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>標題字級 (rem)</label>
                <input type="number" id="heroTitleSize" step="0.1" min="1" max="8">
              </div>
              <div class="form-group">
                <label>描述字級 (rem)</label>
                <input type="number" id="heroDescSize" step="0.1" min="0.5" max="3">
              </div>
              <div class="form-group">
                <label>標籤顏色</label>
                <input type="color" id="heroTagColor">
              </div>
            </div>
            <div class="form-group">
              <label>主視覺圖片</label>
              <div class="image-upload">
                <img id="heroImagePreview" class="image-preview" src="" alt="">
                <input type="file" id="heroImageFile" accept="image/*">
                <button type="button" class="btn btn--outline btn--sm" onclick="document.getElementById('heroImageFile').click()">上傳圖片</button>
              </div>
            </div>
          </div>
        </section>

        <!-- 關於我們 -->
        <section class="tab-panel" id="tab-about">
          <div class="card">
            <h3>公司介紹</h3>
            <div class="form-group">
              <label>區塊標籤</label>
              <input type="text" id="aboutTag">
            </div>
            <div class="form-group">
              <label>標題</label>
              <input type="text" id="aboutTitle">
            </div>
            <div class="form-group">
              <label>介紹文字</label>
              <textarea id="aboutDesc" rows="5"></textarea>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>標題字級 (rem)</label>
                <input type="number" id="aboutTitleSize" step="0.1">
              </div>
              <div class="form-group">
                <label>內文字級 (rem)</label>
                <input type="number" id="aboutDescSize" step="0.1">
              </div>
            </div>
            <h4 style="margin-top:24px">數據統計</h4>
            <div id="aboutStatsEditor"></div>
            <button type="button" class="btn btn--outline btn--sm" id="addStatBtn">+ 新增統計</button>
            <h4 style="margin-top:24px">特色項目</h4>
            <div id="aboutFeaturesEditor"></div>
            <button type="button" class="btn btn--outline btn--sm" id="addFeatureBtn">+ 新增特色</button>
          </div>
        </section>

        <!-- 產品管理 -->
        <section class="tab-panel" id="tab-products">
          <div id="productsEditor"></div>
        </section>

        <!-- 產品特色 -->
        <section class="tab-panel" id="tab-features">
          <div class="card">
            <div class="form-group">
              <label>區塊標籤</label>
              <input type="text" id="featuresTag">
            </div>
            <div class="form-group">
              <label>標題</label>
              <input type="text" id="featuresTitle">
            </div>
            <h4 style="margin-top:16px">特色列表</h4>
            <div id="featuresItemsEditor"></div>
            <button type="button" class="btn btn--outline btn--sm" id="addFeatureItemBtn">+ 新增特色</button>
          </div>
        </section>

        <!-- 產品比較 -->
        <section class="tab-panel" id="tab-comparison">
          <div class="card">
            <div class="form-group">
              <label>區塊標籤</label>
              <input type="text" id="comparisonTag">
            </div>
            <div class="form-group">
              <label>標題</label>
              <input type="text" id="comparisonTitle">
            </div>
            <div class="form-group">
              <label>比較圖片</label>
              <div class="image-upload">
                <img id="comparisonImagePreview" class="image-preview" src="" alt="">
                <input type="file" id="comparisonImageFile" accept="image/*">
                <button type="button" class="btn btn--outline btn--sm" onclick="document.getElementById('comparisonImageFile').click()">上傳圖片</button>
              </div>
            </div>
            <h4 style="margin-top:16px">比較項目</h4>
            <div id="comparisonItemsEditor"></div>
            <button type="button" class="btn btn--outline btn--sm" id="addComparisonBtn">+ 新增比較項</button>
          </div>
        </section>

        <!-- 影片管理 -->
        <section class="tab-panel" id="tab-videos">
          <div class="card">
            <p class="card-hint">貼上 YouTube 連結即可嵌入影片。支援 youtube.com/watch、youtu.be 等格式。</p>
            <div id="videosEditor"></div>
            <button type="button" class="btn btn--outline btn--sm" id="addVideoBtn">+ 新增影片</button>
          </div>
        </section>

        <!-- 案例圖片 -->
        <section class="tab-panel" id="tab-gallery">
          <div class="card">
            <p class="card-hint">上傳實際應用案例照片，建議尺寸 800×600 以上。</p>
            <div id="galleryEditor" class="gallery-editor"></div>
            <button type="button" class="btn btn--outline btn--sm" id="addGalleryBtn">+ 新增圖片</button>
          </div>
        </section>

        <!-- 聯絡資訊 -->
        <section class="tab-panel" id="tab-contact">
          <div class="card">
            <div class="form-row">
              <div class="form-group">
                <label>電話</label>
                <input type="text" id="contactPhone">
              </div>
              <div class="form-group">
                <label>傳真</label>
                <input type="text" id="contactFax">
              </div>
            </div>
            <div class="form-group">
              <label>電子郵件</label>
              <input type="email" id="contactEmail">
            </div>
            <div class="form-group">
              <label>網站</label>
              <input type="text" id="contactWebsite">
            </div>
            <div class="form-group">
              <label>地址</label>
              <input type="text" id="contactAddress">
            </div>
            <div class="form-group">
              <label>營業時間</label>
              <input type="text" id="contactHours">
            </div>
          </div>
        </section>

        <!-- 帳號設定 -->
        <section class="tab-panel" id="tab-settings">
          <div class="card">
            <h3>修改管理密碼</h3>
            <div class="form-group">
              <label>目前密碼</label>
              <input type="password" id="oldPassword">
            </div>
            <div class="form-group">
              <label>新密碼</label>
              <input type="password" id="newPassword">
            </div>
            <div class="form-group">
              <label>確認新密碼</label>
              <input type="password" id="confirmPassword">
            </div>
            <button type="button" class="btn btn--primary btn--sm" id="changePasswordBtn">修改密碼</button>
          </div>
          <div class="card" style="margin-top:20px">
            <h3>品牌資訊</h3>
            <div class="form-group">
              <label>品牌名稱</label>
              <input type="text" id="siteBrandName">
            </div>
            <div class="form-group">
              <label>品牌英文</label>
              <input type="text" id="siteBrandSub">
            </div>
            <div class="form-group">
              <label>品牌標語</label>
              <input type="text" id="siteTagline">
            </div>
            <div class="form-group">
              <label>台灣製造標語</label>
              <input type="text" id="siteMadeInTaiwan">
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/cms.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
